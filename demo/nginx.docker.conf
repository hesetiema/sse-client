# Nginx config for the demo (Docker, upstream on the host).
#
# This is a complete config (worker_processes / events / http), so mount it at
# /etc/nginx/nginx.conf. Mounting it into conf.d/ fails with
# "directive is not allowed here".
#
# Start (from the repo root, with the demo server already on port 8787):
#   docker run --rm -p 8081:8081 -p 8082:8082 \
#     -v "${PWD}/demo/nginx.docker.conf:/etc/nginx/nginx.conf:ro" nginx:alpine
#
# The container reaches the host over host.docker.internal, so the server must
# listen on 0.0.0.0:
#   HOST=0.0.0.0 node demo/server.mjs
#
# Docker Desktop (Windows / macOS) resolves host.docker.internal automatically;
# on Linux add --add-host=host.docker.internal:host-gateway.
#
# The only difference from nginx.conf is the upstream address; ports behave the same:
#   8081 correct (proxy_buffering off + gzip off)
#   8082 deliberately broken (proxy_http_version 1.0 + proxy_buffering on + gzip on)

worker_processes 1;
error_log stderr warn;
pid /tmp/nginx-demo.pid;

events {
  worker_connections 128;
}

http {
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  keepalive_timeout 65s;
  server_tokens off;

  upstream sse_demo {
    server host.docker.internal:8787;
    keepalive 8;
  }

  server {
    listen 8081;
    server_name localhost;

    location / {
      proxy_pass http://sse_demo;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Last-Event-ID $http_last_event_id;

      proxy_buffering off;
      proxy_cache off;
      gzip off;

      chunked_transfer_encoding on;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }

  server {
    listen 8082;
    server_name localhost;

    location / {
      proxy_pass http://sse_demo;
      proxy_http_version 1.0;  # no chunk boundaries upstream: the gateway can only flush when full
      proxy_set_header Host $host;

      proxy_buffering on;
      proxy_buffers 8 256k;
      proxy_busy_buffers_size 512k;

      gzip on;
      gzip_min_length 1;
      gzip_types text/event-stream application/json;

      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }
}
