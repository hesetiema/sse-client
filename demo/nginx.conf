# Nginx config for the demo (local install, upstream on 127.0.0.1).
#
# 8081 is the "correct" config, 8082 is "deliberately broken": switch endpoints in
# the console to reproduce the most common production failure, "connected but
# nothing arrives".
#
# Start (from the repo root):
#   nginx -p demo -c nginx.conf
# Stop:
#   nginx -p demo -c nginx.conf -s stop
#
# No local Nginx? Use demo/nginx.docker.conf instead.

worker_processes 1;
error_log stderr warn;
pid nginx-demo.pid;

events {
  worker_connections 128;
}

http {
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  keepalive_timeout 65s;
  server_tokens off;

  upstream sse_demo {
    server 127.0.0.1:8787;
    keepalive 8;
  }

  # ---------------------------------------------------------------------------
  # 8081: correct SSE config — events should arrive one by one, in real time
  # ---------------------------------------------------------------------------
  server {
    listen 8081;
    server_name localhost;

    location / {
      proxy_pass http://sse_demo;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # An empty Connection header is what keeps the upstream keepalive pool alive
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Last-Event-ID $http_last_event_id;

      # --- the SSE triad ---
      proxy_buffering off;   # forward as it arrives, never buffer the stream
      proxy_cache off;
      gzip off;              # compression waits for a full block, i.e. adds latency
      # --- end of the SSE triad ---

      chunked_transfer_encoding on;
      # Long-lived connections must not be cut by the default 60s read timeout
      # (matters when heartbeats are 15-30s apart)
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }

  # ---------------------------------------------------------------------------
  # 8082: deliberately broken — reproduces "the gateway buffers / compresses the stream"
  #   Measured behaviour (nginx 1.29): the client sits in connecting for a long time
  #   (even the response headers are held back) and receives nothing at all.
  #   Without idleTimeout that is a zombie connection forever; with idleTimeout the
  #   client eventually reports a heartbeat error and reconnects.
  # ---------------------------------------------------------------------------
  server {
    listen 8082;
    server_name localhost;

    location / {
      proxy_pass http://sse_demo;
      proxy_http_version 1.0;      # culprit 1: no chunk boundaries upstream
      proxy_set_header Host $host;

      proxy_buffering on;          # culprit 2: explicit buffering
      proxy_buffers 8 256k;
      proxy_busy_buffers_size 512k;

      gzip on;                     # culprit 3: compression collects the stream into blocks
      gzip_min_length 1;
      gzip_types text/event-stream application/json;

      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }
}
