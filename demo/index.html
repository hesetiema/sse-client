<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>SSE console · @songfreedom/sse-client</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --card: #151b23;
        --line: #232c38;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #4c9aff;
        --ok: #3fb950;
        --warn: #d29922;
        --bad: #f85149;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px 20px 60px;
        background: radial-gradient(1200px 600px at 20% -10%, #17243a 0%, var(--bg) 60%);
        color: var(--text);
        font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        display: grid;
        gap: 16px;
      }
      .head-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.2px;
      }
      .lang {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 999px;
        overflow: hidden;
      }
      .lang button {
        border: 0;
        border-radius: 0;
        padding: 5px 14px;
        font-size: 12px;
        background: transparent;
        color: var(--muted);
      }
      .lang button.active {
        background: #1f4d80;
        color: var(--text);
      }
      .sub {
        margin: 4px 0 12px;
        color: var(--muted);
        font-size: 12.5px;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .pill {
        border: 1px solid var(--line);
        background: #101822;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 12px;
        color: var(--muted);
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      .pill b {
        color: var(--text);
        font-weight: 600;
      }
      #status[data-status="open"] {
        border-color: #1f6f43;
        color: var(--ok);
      }
      #status[data-status="connecting"],
      #status[data-status="reconnecting"] {
        border-color: #6b5a1c;
        color: var(--warn);
      }
      #status[data-status="closed"] {
        border-color: #7d2b28;
        color: var(--bad);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 10px 14px;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      label.check {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: 12.5px;
        padding-top: 16px;
      }
      select,
      input[type="number"] {
        background: #0d141d;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 9px;
        font: inherit;
        font-size: 13px;
        min-width: 0;
      }
      select:focus,
      input:focus {
        outline: 2px solid #2b4f7d;
        outline-offset: 1px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      button {
        background: #1c2531;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 14px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        border-color: #35455a;
      }
      button.primary {
        background: #1f4d80;
        border-color: #2b64a3;
      }
      button.danger {
        color: #ffb4ae;
      }
      .hint {
        margin: 12px 0 0;
        font-size: 12.5px;
        color: var(--muted);
        border-left: 2px solid #2b3a4d;
        padding-left: 10px;
      }
      .log-card {
        padding: 0;
        overflow: hidden;
      }
      .mem-card {
        padding: 0;
        overflow: hidden;
      }
      .mem-body {
        padding: 12px 14px 14px;
      }
      #chart {
        display: block;
        width: 100%;
        height: 96px;
        margin-top: 10px;
        border: 1px solid #182029;
        border-radius: 8px;
        background: #0b1219;
      }
      .mem-legend {
        margin-top: 6px;
        font-size: 11.5px;
        color: var(--muted);
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      .pill b.warn {
        color: var(--warn);
      }
      .pill b.bad {
        color: var(--bad);
      }
      .log-head {
        display: flex;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .log {
        height: 380px;
        overflow: auto;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 12px;
        padding: 8px 0;
      }
      .row {
        display: grid;
        grid-template-columns: 92px 78px 150px 1fr;
        gap: 10px;
        padding: 3px 14px;
        border-bottom: 1px solid #11171f;
        white-space: nowrap;
      }
      .row:hover {
        background: #101822;
      }
      .t {
        color: #5b6675;
      }
      .k {
        color: var(--muted);
      }
      .k.msg {
        color: var(--accent);
      }
      .k.error {
        color: var(--bad);
      }
      .k.open {
        color: var(--ok);
      }
      .k.close {
        color: var(--warn);
      }
      .title {
        color: #c9d4e0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .detail {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media (max-width: 720px) {
        .row {
          grid-template-columns: 80px 68px 1fr;
        }
        .row .detail {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="head-row">
          <h1 data-i18n="app.title">SSE console</h1>
          <div class="lang" role="group" aria-label="Language switch">
            <button id="lang-en" type="button">EN</button>
            <button id="lang-zh" type="button">中文</button>
          </div>
        </div>
        <p class="sub" data-i18n="app.subtitle">
          @songfreedom/sse-client · real browser + real Nginx + real streaming
        </p>
        <div class="pills">
          <span class="pill" id="status" data-status="idle">idle</span>
          <span class="pill"><span data-i18n="pill.attempts">attempts</span> <b id="attempts">0</b></span>
          <span class="pill">lastEventId <b id="lastId">-</b></span>
          <span class="pill"><span data-i18n="pill.events">events</span> <b id="count">0</b></span>
        </div>
      </header>

      <section class="card">
        <div class="grid">
          <label>
            <span data-i18n="field.endpoint">Endpoint</span>
            <select id="endpoint">
              <option value="direct" data-i18n="endpoint.direct">Direct :8787 (no gateway)</option>
              <option value="nginx" data-i18n="endpoint.nginx">Nginx :8081 (correct)</option>
              <option value="broken" data-i18n="endpoint.broken">Nginx :8082 (misconfigured)</option>
            </select>
          </label>
          <label>
            <span data-i18n="field.scenario">Scenario</span>
            <select id="scenario"></select>
          </label>
          <label>
            <span data-i18n="field.interval" title="interval">Interval (ms)</span>
            <input id="interval" type="number" value="1000" min="20" step="100" />
          </label>
          <label>
            <span data-i18n="field.burst" title="burst">burst (flood / burst)</span>
            <input id="burst" type="number" value="10" min="1" step="10" />
          </label>
          <label>
            <span data-i18n="field.size" title="size">payload bytes (flood / burst)</span>
            <input id="size" type="number" value="1024" min="64" step="256" />
          </label>
          <label>
            <span data-i18n="field.idle" title="idleTimeout">idleTimeout (ms)</span>
            <input id="idle" type="number" value="0" min="0" step="500" />
          </label>
          <label>
            <span data-i18n="field.rotate" title="rotateInterval">rotateInterval (ms)</span>
            <input id="rotate" type="number" value="0" min="0" step="1000" />
          </label>
          <label>
            <span data-i18n="field.maxRetry" title="maxRetry">maxRetry</span>
            <input id="maxRetry" type="number" value="3" min="0" />
          </label>
          <label>
            <span data-i18n="field.ttl">token TTL (ms)</span>
            <input id="ttl" type="number" value="60000" min="1000" step="1000" />
          </label>
          <label class="check">
            <input type="checkbox" id="pauseHidden" />
            <span data-i18n="opt.pauseHidden" title="pauseWhenHidden">pauseWhenHidden (suspend in background)</span>
          </label>
          <label class="check">
            <input type="checkbox" id="refreshToken" />
            <span data-i18n="opt.refreshToken">Refresh token on 401, then retry</span>
          </label>
          <label class="check">
            <input type="checkbox" id="reconnectOnEnd" checked />
            <span data-i18n="opt.reconnectOnEnd">Reconnect when the server ends the stream</span>
          </label>
        </div>

        <div class="actions">
          <button id="connect" class="primary" type="button" data-i18n="btn.connect">Connect</button>
          <button id="restart" type="button" data-i18n="btn.restart">Restart (keep lastEventId)</button>
          <button id="close" type="button" data-i18n="btn.close">Close</button>
          <button id="revoke" class="danger" type="button" data-i18n="btn.revoke">Revoke token</button>
          <button id="clear" type="button" data-i18n="btn.clear">Clear log</button>
        </div>

        <p class="hint" id="hint" data-i18n="hint.default">Pick a scenario to see what to watch for.</p>
      </section>

      <section class="card mem-card">
        <div class="log-head">
          <span data-i18n="mem.title">Memory sampler</span>
          <span id="memSource">performance.memory</span>
        </div>
        <div class="mem-body">
          <div class="pills">
            <span class="pill">heap <b id="heap">-</b></span>
            <span class="pill">peak <b id="peak">-</b></span>
            <span class="pill" title="delta since Connect, before GC — a saw-tooth is normal">
              <span data-i18n="mem.delta">Δ heap</span> <b id="heapDelta">-</b>
            </span>
            <span class="pill">recv <b id="recv">0 MB</b></span>
            <span class="pill"><span data-i18n="mem.rate">rate</span> <b id="rate">0 /s</b></span>
            <span class="pill">dom <b id="dom">-</b></span>
          </div>
          <canvas id="chart" width="1000" height="96"></canvas>
          <div class="mem-legend" id="memLegend">heap — · dom —</div>
        </div>
      </section>

      <section class="card log-card">
        <div class="log-head"><span data-i18n="log.title">Event log</span><span id="endpointLabel">-</span></div>
        <div id="log" class="log"></div>
      </section>
    </main>

    <script type="module">
      // Keep the failure modes visible instead of a page that renders but does nothing.
      const hint = document.getElementById("hint");
      let zh = false;
      try {
        const stored = localStorage.getItem("sse-demo-lang");
        zh = stored ? stored === "zh" : (navigator.language || "").toLowerCase().startsWith("zh");
      } catch {
        zh = false;
      }
      const fail = (message) => {
        hint.textContent = message;
        hint.style.color = "#f85149";
        hint.style.borderLeftColor = "#f85149";
      };

      // The ?t= suffix bypasses the ES module cache: this page is edited while it is
      // open, and a stale main.js used to look like "buttons do nothing".
      import(`./main.js?t=${Date.now()}`).catch((error) => {
        fail(
          zh
            ? `加载失败：先执行 pnpm build 生成 dist/，再刷新页面。原因：${error.message}`
            : `Failed to load: run "pnpm build" to generate dist/, then refresh. Reason: ${error.message}`,
        );
      });

      // main.js sets __sseDemoReady once it wired everything up.
      setTimeout(() => {
        if (window.__sseDemoReady) return;
        fail(
          zh
            ? "界面脚本没有启动（可能是旧缓存，或 dist/ 未构建）。请按 Ctrl+F5 强制刷新。"
            : "The UI script did not start (stale cache, or dist/ is missing). Press Ctrl+F5 to hard refresh.",
        );
      }, 2000);
    </script>
  </body>
</html>
